[package]
name = "proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "zstd", "socks"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2"
tracing = "0.1"
futures-util = "0.3"
rustls-pemfile = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

