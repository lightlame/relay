[package]
name = "security"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }

[dev-dependencies]
rand = "0.10"
