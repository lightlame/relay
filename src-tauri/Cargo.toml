[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"
description = "Relay local HTTP/HTTPS traffic inspector"
rust-version = "1.85"

[lib]
name = "relay_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Relay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
domain = { path = "../crates/domain" }
proxy = { path = "../crates/proxy" }
replay = { path = "../crates/replay" }
curl_export = { path = "../crates/curl_export" }
storage = { path = "../crates/storage" }
security = { path = "../crates/security" }
local-ip-address = "0.6"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }

