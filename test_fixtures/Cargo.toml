[package]
name = "test_fixtures"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
domain = { path = "../crates/domain" }
proxy = { path = "../crates/proxy" }
replay = { path = "../crates/replay" }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde_json = "1"
